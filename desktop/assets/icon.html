<!doctype html>
<html>
<head><meta charset="utf-8"><style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
svg{display:block;width:100%;height:100%}
</style></head>
<body>
<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <rect x="1" y="1" width="30" height="30" rx="8" fill="#2563EB"/>
  <path d="M9 17c0-4.4 3.6-8 8-8 2.2 0 4.1.9 5.6 2.3" fill="none" stroke="#fff" stroke-linecap="round" stroke-width="2.6"/>
  <path d="M23 15c0 4.4-3.6 8-8 8-2.2 0-4.1-.9-5.6-2.3" fill="none" stroke="#fff" stroke-linecap="round" stroke-width="2.6"/>
  <circle cx="22.5" cy="11.2" r="2.7" fill="#56D9B5"/>
  <circle cx="9.5" cy="20.8" r="2.7" fill="#FF6B4A"/>
  <g id="badge" style="display:none">
    <circle cx="26" cy="26" r="5" fill="#fff"/>
    <circle cx="26" cy="26" r="3.6" fill="#22C55E"/>
  </g>
</svg>
<script>
  const p = new URLSearchParams(location.search);
  const badge = p.get('badge');
  if (badge) {
    const g = document.getElementById('badge');
    g.style.display = '';
    const colors = { green: '#22C55E', amber: '#F59E0B', gray: '#94A3B8', red: '#EF4444' };
    g.querySelectorAll('circle')[1].setAttribute('fill', colors[badge] || colors.gray);
  }
</script>
</body>
</html>
