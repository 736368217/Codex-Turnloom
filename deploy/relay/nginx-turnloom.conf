# Codex-Turnloom public HTTPS entry (direct path).
#
# Install as /etc/nginx/sites-available/turnloom, symlink into sites-enabled,
# replace __PUBLIC_HOST__ with the real hostname, and make sure a matching
# Let's Encrypt certificate exists at /etc/letsencrypt/live/__PUBLIC_HOST__/.
#
# Why direct instead of a tunnel-only entry: measured 58–318 ms per request over
# a Cloudflare Tunnel from mainland China versus 58 ms warm on this path, and the
# tunnel edge selected for this host was AMS/LAX. The tunnel stays available under
# a second hostname as a fallback (see deploy/relay/README.md).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __PUBLIC_HOST__;

    ssl_certificate     /etc/letsencrypt/live/__PUBLIC_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__PUBLIC_HOST__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TurnloomTLS:10m;
    ssl_session_timeout 1h;

    access_log /var/log/nginx/turnloom-access.log;
    error_log  /var/log/nginx/turnloom-error.log warn;

    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:18786;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Overwrite (never append): the gateway keys its failed-token throttle on the
        # first X-Forwarded-For entry, so a client-supplied header must not survive.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # SSE / long-poll: never buffer, never time out mid-stream.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
